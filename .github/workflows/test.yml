name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mcp<2 matches the pin Codeflow installs OpenSpace with.
      - run: pip install -e . "mcp<2" pytest pytest-asyncio
      # tests/benchmarks needs the terminal-bench harness, which CI does not install.
      - run: python -m pytest -q --ignore=tests/benchmarks tests
